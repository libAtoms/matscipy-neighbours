name: Wheels

# Build CPU-only wheels for every push to main and every PR, and on a version
# tag (e.g. `1.0.1`) additionally build the sdist, publish everything to PyPI
# and create a GitHub release. The version is taken from the tag by
# setuptools-scm (see pyproject.toml).
#
# PyPI publishing uses trusted publishing (OIDC): on PyPI, add a trusted
# publisher for libAtoms/matscipy-neighbours, workflow `wheels.yml`,
# environment `pypi`.

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.python }} on ${{ matrix.buildplat[1] }} ${{ matrix.buildplat[2] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      matrix:
        buildplat:
          - [ubuntu-24.04, manylinux, x86_64]
          - [ubuntu-24.04-arm, manylinux, aarch64]
          - [macos-14, macosx, arm64]
          - [windows-2022, win, AMD64]
        python: [cp310, cp311, cp312, cp313, cp314]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs the tags

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ARCHS: ${{ matrix.buildplat[2] }}
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_REQUIRES: pytest ase
          CIBW_TEST_COMMAND: pytest {project}/tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build sdist
        run: pipx run build --sdist --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/matscipy-neighbours/
    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes: the CHANGELOG.md section for this version.
          awk -v tag="$TAG" '
            /^## \[/ { if (found) exit; found = index($0, "[" tag "]") }
            found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
